version: '3.8'

services:
  # Elasticsearch - Core search and analytics engine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ai-siem-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ./elasticsearch/data:/usr/share/elasticsearch/data
      - ./elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - siem-network
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana - Elasticsearch visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: ai-siem-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    volumes:
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "5601:5601"
    networks:
      - siem-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: curl -s http://localhost:5601/api/status >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5

  # Logstash - Log processing and pipeline
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: ai-siem-logstash
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - LS_JAVA_OPTS=-Xmx256m -Xms256m
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logs:/var/log/siem:ro
    ports:
      - "5000:5000/tcp"
      - "5000:5000/udp"
      - "9600:9600"
    networks:
      - siem-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: curl -s http://localhost:9600 >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5

  # Grafana - Advanced visualization and dashboards
  grafana:
    image: grafana/grafana:10.2.0
    container_name: ai-siem-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=change_me_grafana_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./grafana/config/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - siem-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: curl -s http://localhost:3000/api/health >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis - Cache and message queue for real-time processing
  redis:
    image: redis:7-alpine
    container_name: ai-siem-redis
    command: redis-server --appendonly yes --requirepass change_me_redis_password
    volumes:
      - ./redis/data:/data
    ports:
      - "6379:6379"
    networks:
      - siem-network
    healthcheck:
      test: redis-cli --raw incr ping
      interval: 30s
      timeout: 10s
      retries: 5

  # Anomaly Detection Engine - Custom Python service
  anomaly-detector:
    build:
      context: ./anomaly-detection
      dockerfile: Dockerfile
    container_name: ai-siem-anomaly-detector
    environment:
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_USER=elastic
      - ELASTICSEARCH_PASSWORD=change_me_elastic_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=change_me_redis_password
    volumes:
      - ./anomaly-detection:/app
      - ./logs:/var/log/siem
    networks:
      - siem-network
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Threat Detection Engine - Custom Python service
  threat-detector:
    build:
      context: ./threat-detection
      dockerfile: Dockerfile
    container_name: ai-siem-threat-detector
    environment:
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_USER=elastic
      - ELASTICSEARCH_PASSWORD=change_me_elastic_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=change_me_redis_password
    volumes:
      - ./threat-detection:/app
      - ./logs:/var/log/siem
    networks:
      - siem-network
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Alerting Engine - Custom Python service
  alerting-engine:
    build:
      context: ./alerting
      dockerfile: Dockerfile
    container_name: ai-siem-alerting
    environment:
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_USER=elastic
      - ELASTICSEARCH_PASSWORD=change_me_elastic_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=change_me_redis_password
    volumes:
      - ./alerting:/app
      - ./alerting/config:/app/config
    networks:
      - siem-network
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Automated Response System - Blocks malicious IPs and ports
  automated-response:
    build:
      context: ./automated-response
      dockerfile: Dockerfile
    container_name: ai-siem-response
    environment:
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_USER=elastic
      - ELASTICSEARCH_PASSWORD=change_me_elastic_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=change_me_redis_password
      - AUTO_BLOCK_ENABLED=true
      - BLOCK_DURATION_MINUTES=60
      - DRY_RUN_MODE=false
    volumes:
      - ./automated-response:/app
    networks:
      - siem-network
    # Grant network admin capabilities for iptables management
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Use host network mode to apply firewall rules to host
    # Comment out to run in isolated mode (dry-run only)
    # network_mode: host
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # SIEM Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-siem-frontend
    environment:
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_USER=elastic
      - ELASTICSEARCH_PASSWORD=change_me_elastic_password
    ports:
      - "8080:8080"
    networks:
      - siem-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

networks:
  siem-network:
    driver: bridge

volumes:
  elasticsearch-data:
  redis-data:
