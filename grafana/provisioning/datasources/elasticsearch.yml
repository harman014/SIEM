apiVersion: 1

datasources:
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    basicAuth: false
    isDefault: true
    jsonData:
      esVersion: 80
      logMessageField: message
      logLevelField: level
      timeField: "@timestamp"
      index: "siem-logs-*"
      timeInterval: "10s"
    version: 1
    editable: true
