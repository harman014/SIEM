[paths]
data: /var/lib/grafana

[server]
protocol: http
http_addr: 0.0.0.0
http_port: 3000
root_url: http://localhost:3000

[security]
admin_user: admin
admin_password: change_me_grafana_password

[auth]
disable_login_form: false
oauth_auto_login: false

[users]
allow_sign_up: false

[datasources]
provisioning_path: /etc/grafana/provisioning/datasources

[dashboards]
default_home_dashboard_path: /etc/grafana/provisioning/dashboards
