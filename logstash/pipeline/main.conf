# Main log processing pipeline
input {
  # TCP input for standard syslog
  tcp {
    port => 5000
    codec => json
    type => "network_log"
  }

  # UDP input for syslog
  udp {
    port => 5000
    codec => plain
    type => "syslog"
  }

  # File input for application logs
  file {
    path => "/var/log/siem/*.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb"
    type => "file_log"
  }
}

filter {
  # Parse syslog format
  if [type] == "syslog" {
    grok {
      match => { "message" => "%{SYSLOGLINE}" }
    }
  }

  # Parse JSON logs
  if [type] == "network_log" {
    json {
      source => "message"
    }
  }

  # Add timestamp field
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }

  # GeoIP enrichment for IP addresses
  if [src_ip] {
    geoip {
      source => "src_ip"
      target => "src_geo"
    }
  }

  if [dst_ip] {
    geoip {
      source => "dst_ip"
      target => "dst_geo"
    }
  }

  # Add event metadata
  mutate {
    add_field => { "ingestion_time" => "%{@timestamp}" }
    add_field => { "pipeline_version" => "1.0" }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "siem-logs-%{+YYYY.MM.dd}"
    action => "create"
  }

  # Console output for debugging (remove in production)
  # stdout { codec => json }
}
